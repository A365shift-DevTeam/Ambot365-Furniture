<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    
    <!-- Priority Preload Initial Hero View Image -->
    <link
      rel="preload"
      as="image"
      href="/hero-default-720.webp"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 767px)"
    />
    <link
      rel="preload"
      as="image"
      href="/hero-default-1440.webp"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 768px)"
    />
    
    <!-- Preconnect Cloudinary CDN (scroll frames + section images) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Preconnect Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&amp;family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=optional" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&amp;family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=optional" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&amp;family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&amp;family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=optional" />
    </noscript>

    <!-- Meta Description & SEO -->
    <meta name="description" content="Ambot365 creates enduring luxury furniture through material intelligence, exacting craft, and architectural design." />
    <meta property="og:title" content="Ambot365 Furniture · Handcrafted Luxury Studio" />
    <meta property="og:description" content="Objects for a considered life. Precision joinery and regenerative material intelligence." />
    <meta property="og:image" content="/hero-default.jpeg" />

    <title>Ambot365 Furniture</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
